<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content">
    <title>Smess</title>
    <link rel="stylesheet" href="splash/style.css">
    <link rel="stylesheet" href="email/style.css">
</head>
<body>
    <div class="splash" id="splash">
        <div class="logo" aria-label="Smess">
            <span>S</span><span>m</span><span>e</span><span>s</span><span>s</span>
        </div>
        <div class="progress" aria-hidden="true">
            <div class="progress__fill"></div>
        </div>
    </div>

    <div class="auth" id="auth">
        <div class="auth__animation" id="authAnimation"></div>
        <div class="auth__logo">Smess</div>
        <div class="auth__title">Введите вашу почту, чтобы продолжить</div>
        <form class="auth__form" id="authForm" novalidate>
            <input class="auth__input" id="emailInput" type="email" name="email"
                   placeholder="you@example.com" autocomplete="email"
                   inputmode="email" spellcheck="false" required>
            <button class="auth__button" id="submitBtn" type="submit">Продолжить</button>
            <div class="auth__error" id="authError"></div>
        </form>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/bodymovin/5.12.2/lottie.min.js"></script>
    <script src="splash/script.js"></script>
    <script src="email/script.js"></script>
</body>
</html>
